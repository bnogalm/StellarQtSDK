# Name shown in GitHub's "Actions" tab.
name: CI

# --- WHEN it runs ---
# On every push to any branch, and on every pull request.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    # One job per (Qt, OS) entry below — each with its own green/red status.
    name: ${{ matrix.os }} · Qt ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}

    # --- THE MATRIX ---
    # Run this whole job once per entry. Pinning each Qt to an OS whose GCC fits
    # its era is what catches version-specific breakage (e.g. the S4 QTimeZone
    # bug surfaced on Qt 6.4) without tripping over toolchain mismatches.
    strategy:
      # Don't cancel the other entries when one fails — we want the full picture.
      fail-fast: false
      matrix:
        include:
          # Qt 5.15.2 (2020) does NOT build under GCC 13's leaner libstdc++: its
          # own headers (e.g. QtCore/qrandom.h) rely on transitive <limits> /
          # <cstring> that GCC 13 dropped. Build it on ubuntu-22.04 (GCC 11), a
          # toolchain from its era. (ubuntu-latest is GCC 13.)
          - { qt: '5.15.2', os: 'ubuntu-22.04' }
          - { qt: '6.4.3',  os: 'ubuntu-latest' }   # the version that exposed S4
          - { qt: '6.8.1',  os: 'ubuntu-latest' }   # current line

    steps:
      # 1) Bring OUR code onto the runner (the VM starts empty).
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Install the matrix's Qt version. 'cache: true' keeps each version's
      #    download warm across runs.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true

      # 3) Generate the Makefile from our .pro.
      - name: qmake
        run: qmake StellarQtSDKTest.pro

      # 4) Compile, using all available cores. '-k' (keep-going) makes a failing
      #    build report EVERY compile error in one run instead of stopping at the
      #    first file — so a missing-include sweep can be done in a single pass
      #    rather than one CI round per file. The job still goes red on any error.
      - name: Build
        run: make -k -j$(nproc)

      # 5) Run the tests. Exit code = number of failed tests → red on failure.
      - name: Run tests
        run: ./StellarQtSDKTest
