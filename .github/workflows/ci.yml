# Name shown in GitHub's "Actions" tab.
name: CI

# --- WHEN it runs ---
# On every push to any branch, and on every pull request.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    # ${{ matrix.qt }} expands to each Qt version below, so you get one job
    # per version, each with its own green/red status in the UI.
    name: Ubuntu · Qt ${{ matrix.qt }}
    runs-on: ubuntu-latest

    # --- THE MATRIX ---
    # Run this whole job once per value of 'qt'. This is what catches
    # version-specific breakage like the S4 bug (QTimeZone::UTC is Qt 6.5+):
    # it would compile here on 6.8 but fail on 6.4.
    strategy:
      # Don't cancel the other versions when one fails — we want to see the
      # full picture (which versions pass, which break), not just the first red.
      fail-fast: false
      matrix:
        qt:
          - '5.15.2'   # last Qt 5 LTS (README claims it still works — let's verify)
          - '6.4.3'    # Qt 6.4 (ships in Ubuntu 24.04); the version that exposed S4
          - '6.8.1'    # current line

    steps:
      # 1) Bring OUR code onto the runner (the VM starts empty).
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Install the matrix's Qt version. 'cache: true' keeps each version's
      #    download warm across runs.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true

      # 3) Generate the Makefile from our .pro.
      - name: qmake
        run: qmake StellarQtSDKTest.pro

      # 4) Compile, using all available cores.
      - name: Build
        run: make -j$(nproc)

      # 5) Run the tests. Exit code = number of failed tests → red on failure.
      - name: Run tests
        run: ./StellarQtSDKTest
